<!-- Define the mat card -->

<mat-card class="login-page">
  <mat-card-header>
    <mat-card-title>Welcome back fellow ZenMate user!</mat-card-title>
    <mat-card-subtitle>Please login to continue</mat-card-subtitle>
  </mat-card-header>

  <!-- Define the fields -->
  <!-- Email -->
  <mat-card-content>
    <form [formGoup]="loginForm" (ngSubmit)="onSubmit()" class="login-details">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="your@email.com"
          required
        />
        <mat-icon matSuffix>email</mat-icon>
        <!-- If no email is entered, display an error -->
        <mat-error *ngIf="email?.haserror('required')"
          >Email is required</mat-error
        >
        <mat-error *ngIf="email?.haserror('email')"
          >Please enter a valid email</mat-error
        >
      </mat-form-field>
    </form>
  </mat-card-content>
</mat-card>
