<div class="sun-container" [ngClass]="timeOfDay">
  <div class="sun" [ngStyle]="sunStyle">
    <img src="../../../../assets/sunrise.gif" alt="Sun" />
  </div>
  <div class="horizon"></div>
  <div class="time-display">
    <div>Current: {{ timeDisplay.current }}</div>
    <div>Sunrise: {{ timeDisplay.sunrise }}</div>
    <div>Sunset: {{ timeDisplay.sunset }}</div>
    <div>Timezone: {{ timeDisplay.timezone }}</div>
  </div>
</div>
